  <!-- Caption -->
  <g fill="#261912">
    <text x="126" y="676" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">COMPACT 65% CASE</text>
    <text x="126" y="708" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" opacity=".58">CNC ALUMINUM · 6° TYPING ANGLE · USB-C</text>
