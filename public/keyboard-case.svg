<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Compact mechanical keyboard case</title>
  <desc id="desc">Isometric technical illustration of a compact keyboard case with a recessed plate, mounting holes, and USB opening.</desc>

  <defs>
    <linearGradient id="caseTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d2b8"/>
      <stop offset="1" stop-color="#c97f53"/>
    </linearGradient>
    <linearGradient id="caseFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8663d"/>
      <stop offset="1" stop-color="#71351f"/>
    </linearGradient>
    <linearGradient id="caseSide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#944b2c"/>
      <stop offset="1" stop-color="#542616"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30343a"/>
      <stop offset="1" stop-color="#111318"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="170%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#f6f3ee"/>
  <ellipse cx="602" cy="626" rx="465" ry="72" fill="#3b2418" opacity=".16" filter="url(#shadow)"/>

  <!-- Lower case walls -->
  <path d="M126 304 759 131 1080 315 1080 421 447 617 126 421Z" fill="url(#caseFront)"/>
  <path d="M447 511 1080 315 1080 421 447 617Z" fill="url(#caseSide)"/>
  <path d="M126 304 447 488 447 617 126 421Z" fill="#8d482a"/>

  <!-- Top shell -->
  <path d="M126 304 759 111 1080 295 447 488Z" fill="url(#caseTop)" stroke="#71351f" stroke-width="5" stroke-linejoin="round"/>

  <!-- Inner plate recess -->
  <path d="M203 306 754 142 1000 284 448 451Z" fill="#7c432b" opacity=".72"/>
  <path d="M221 301 752 153 978 282 448 432Z" fill="url(#plate)" stroke="#552b1b" stroke-width="4" stroke-linejoin="round"/>

  <!-- Switch grid -->
  <g fill="#08090b" stroke="#626872" stroke-width="2">
