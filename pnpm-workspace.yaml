# Single-package repo. The `packages` field is required by pnpm when a
# pnpm-workspace.yaml is present (Railway/CI fail without it).
packages:
  - .

allowBuilds:
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
  - onnxruntime-node
  - protobufjs
